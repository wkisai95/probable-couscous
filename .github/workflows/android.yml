name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Firma stabile: ogni versione deve avere la stessa chiave, altrimenti
      # Android rifiuta l'aggiornamento. Con i secret ANDROID_KEYSTORE_B64 & co.
      # usa la tua chiave; altrimenti una chiave generata una volta e conservata
      # nella cache del repository (privata ai workflow).
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.tokenarb-signing/release.jks
          key: tokenarb-signing-key-v1

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
          else
            KS="$HOME/.tokenarb-signing/release.jks"
            if [ ! -f "$KS" ]; then
              mkdir -p "$(dirname "$KS")"
              keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias tokenarb \
                -keyalg RSA -keysize 4096 -validity 10000 \
                -storepass tokenarb-ci -keypass tokenarb-ci -dname "CN=TokenArb, O=wkisai95, C=IT"
              echo "::notice title=Firma::Creata una nuova chiave di firma (conservata in cache)"
            fi
            {
              echo "ANDROID_KEYSTORE_PATH=$KS"
              echo "ANDROID_KEYSTORE_PASSWORD=tokenarb-ci"
              echo "ANDROID_KEY_ALIAS=tokenarb"
              echo "ANDROID_KEY_PASSWORD=tokenarb-ci"
            } >> "$GITHUB_ENV"
          fi

      - name: Build
        run: gradle -p android assembleRelease --stacktrace

      - name: Signing fingerprint
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          FP=$("$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
               | grep -m1 "SHA-256" | awk '{print $NF}')
          echo "Certificato SHA-256: $FP"
          echo "::notice title=Certificato di firma::SHA-256 $FP"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TokenArb.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TokenArb-apk
          path: TokenArb.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: TokenArb Android 1.0.${{ github.run_number }}
          body: |
            APK dello scanner di arbitraggio (token Coinbase su Base vs Wall Street).
            Scarica `TokenArb.apk` sul telefono e installalo.
          files: TokenArb.apk
          make_latest: true
