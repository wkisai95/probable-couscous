name: Android live scan test

# Esegue il motore di scansione dell'app (stesso codice Kotlin del telefono) contro le API reali
# e pubblica tempi, errori e risultati come annotazioni della run.
on:
  workflow_dispatch: {}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Live scan
        env:
          TOKENARB_LIVE: "1"
        run: |
          set -o pipefail
          gradle -p android :app:testReleaseUnitTest --tests '*LiveScanTest*' 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Report
        if: always()
        run: |
          python3 - <<'EOF'
          import pathlib, re
          rep = pathlib.Path("android/app/build/live-report.md")
          if rep.exists():
              text = rep.read_text()
              blocks = re.split(r"^## ", text, flags=re.M)
              for b in blocks:
                  if not b.strip():
                      continue
                  title, _, body = b.partition("\n")
                  msg = body.strip().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  for i in range(0, max(len(msg), 1), 3800):
                      print(f"::notice title={title.strip()[:80]}::{msg[i:i + 3800]}")
          else:
              log = pathlib.Path("${{ runner.temp }}/test.log").read_text(errors="replace").splitlines()
              errs = [l for l in log if l.startswith("e: ") or "FAILED" in l or "Exception" in l][:40]
              msg = "\n".join(errs or log[-40:]).replace("%", "%25").replace("\n", "%0A")
              print(f"::error title=Test non eseguito::{msg}")
          EOF
