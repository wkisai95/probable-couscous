name: Coinbase tokenized stocks (Base) arbitrage scanner

on:
  schedule:
    - cron: "*/15 * * * *"   # ogni 15 minuti (GitHub può ritardare di qualche minuto)
  workflow_dispatch: {}

concurrency:
  group: tokenarb-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Stato degli alert (cooldown) e storico CSV tra un'esecuzione e l'altra
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            state
            data
          key: tokenarb-state-${{ github.run_id }}
          restore-keys: tokenarb-state-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m tokenarb scan

      - name: Upload scan log
        uses: actions/upload-artifact@v4
        with:
          name: scans-${{ github.run_id }}
          path: data/scans.csv
          retention-days: 7
          if-no-files-found: ignore
