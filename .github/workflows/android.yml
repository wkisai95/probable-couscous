name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Firma: con i secret ANDROID_KEYSTORE_B64 & co. usa la tua chiave;
      # altrimenti una chiave debug conservata in cache, così gli aggiornamenti
      # si installano sopra la versione precedente.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TokenArb.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TokenArb-apk
          path: TokenArb.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: TokenArb Android 1.0.${{ github.run_number }}
          body: |
            APK dello scanner di arbitraggio (token Coinbase su Base vs Wall Street).
            Scarica `TokenArb.apk` sul telefono e installalo.
          files: TokenArb.apk
          make_latest: true
